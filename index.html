<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>8/31-9/4 東京自由行</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京行程">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #dbeafe;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #e8f8f8 0%, #f4fbfb 50%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 75px;
      box-shadow: 0 0 25px rgba(0, 128, 138, 0.2);
      min-height: 100vh;
    }

    /* 頂部 Header - Tokyo DisneySea 25th Sparkling Jubilee 蒂芬妮藍綠漸層 */
    .header {
      background: linear-gradient(135deg, #005b66 0%, #00808a 50%, #00a896 100%);
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 91, 102, 0.35);
      border-bottom: 2px solid #a5f3fc;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 60, 70, 0.4);
    }

    /* 頁面切換 View */
    .page-view {
      display: none;
    }

    .page-view.active {
      display: block;
    }

    /* 天數橫向導覽列 */
    .days-nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .days-nav::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #b2f5ea;
      background-color: #ffffff;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: linear-gradient(135deg, #006d77 0%, #009688 100%);
      color: #ffffff;
      border-color: #80e9dd;
      box-shadow: 0 4px 12px rgba(0, 109, 119, 0.3);
    }

    /* 時間軸區域 */
    .timeline-container {
      padding: 8px 16px 20px 16px;
      position: relative;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 78px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background-color: #80e9dd;
      z-index: 1;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    .time-badge {
      width: 52px;
      padding: 4px 6px;
      background-color: #ccfbf1;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .timeline-node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #00808a;
      background-color: #ffffff;
      margin: 9px 12px 0 12px;
      z-index: 2;
      flex-shrink: 0;
    }

    /* 行程卡片 */
    .card {
      flex: 1;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(0, 109, 119, 0.05);
      border: 1px solid #e6f4f1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: #f0fdfa;
      color: #0d9488;
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      flex-shrink: 0;
      border: 1px solid #99f6e4;
    }

    .card-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      white-space: pre-line;
      -webkit-user-select: text;
      user-select: text;
    }

    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: #0284c7;
      font-size: 12px;
      text-decoration: underline;
      word-break: break-all;
    }

    .quick-links {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-link-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid #bfdbfe;
    }

    /* ==================== 可愛機票卡片專屬樣式 ==================== */
    .flight-ticket-card {
      flex: 1;
      background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
      border-radius: 18px;
      padding: 0;
      box-shadow: 0 4px 15px rgba(0, 128, 138, 0.12);
      border: 1.5px solid #99f6e4;
      overflow: hidden;
      position: relative;
    }

    .flight-ticket-top {
      background: linear-gradient(135deg, #005b66 0%, #00808a 100%);
      color: #ffffff;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
    }

    .flight-badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .flight-ticket-body {
      padding: 14px 16px;
    }

    .flight-airports {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .airport-box {
      text-align: center;
    }

    .airport-code {
      font-size: 22px;
      font-weight: 800;
      color: #0f766e;
      letter-spacing: 1px;
    }

    .airport-city {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }

    .airport-time {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2px;
    }

    .airport-terminal {
      font-size: 11px;
      color: #64748b;
    }

    .flight-path {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
    }

    .flight-duration {
      font-size: 11px;
      font-weight: 700;
      color: #0d9488;
      margin-bottom: 2px;
    }

    .flight-line {
      width: 100%;
      height: 2px;
      background: #ccfbf1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flight-plane-icon {
      font-size: 16px;
      transform: rotate(90deg);
      background: #f0fdfa;
      padding: 0 2px;
    }

    .flight-type {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .flight-ticket-footer {
      border-top: 1.5px dashed #b2f5ea;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      font-size: 11px;
      color: #64748b;
      position: relative;
    }

    .barcode-line {
      letter-spacing: 2px;
      font-family: monospace;
      color: #94a3b8;
      font-size: 12px;
      font-weight: bold;
    }

    /* ==================== 行李清單專屬樣式 ==================== */
    .checklist-container {
      padding: 16px 20px;
    }

    .checklist-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: 0 4px 15px rgba(0, 109, 119, 0.06);
      border: 1px solid #e6f4f1;
    }

    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #e2e8f0;
    }

    .checklist-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }

    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px;
      background-color: #f8fafc;
      border-radius: 14px;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .check-item:hover {
      background-color: #f0fdfa;
      border-color: #ccfbf1;
    }

    .check-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 1px;
      accent-color: #00808a;
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-text {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      line-height: 1.4;
      flex: 1;
      transition: all 0.2s ease;
    }

    .check-item.done {
      background-color: #f1f5f9;
      opacity: 0.6;
    }

    .check-item.done .check-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .item-delete-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
    }

    .item-delete-btn:hover {
      color: #ef4444;
    }

    .add-item-box {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
    }

    .add-item-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      background-color: #f8fafc;
    }

    .add-item-input:focus {
      border-color: #00808a;
      background-color: #ffffff;
    }

    .add-item-btn {
      padding: 10px 16px;
      background: linear-gradient(135deg, #005b66 0%, #00808a 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 底部 Tab 列 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #ffffff;
      border-top: 1px solid #e6f4f1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .bottom-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 6px 0;
    }

    .bottom-tab.active {
      color: #00808a;
      font-weight: bold;
    }

    .tab-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>8/31-9/4 東京自由行</h1>
    </header>

    <!-- 1. 行程頁面 -->
    <div id="pageItinerary" class="page-view active">
      <div class="days-nav" id="daysNav"></div>
      <div class="timeline-container" id="timelineList"></div>
    </div>

    <!-- 2. 行李清單頁面 -->
    <div id="pageChecklist" class="page-view">
      <div class="checklist-container">
        <div class="checklist-card">
          <div class="checklist-header">
            <div class="checklist-title">🧳 隨身與託運行李</div>
            <button class="reset-btn" onclick="resetChecklist()">一鍵重置</button>
          </div>

          <div class="checklist-items" id="checklistItemsList"></div>

          <div class="add-item-box">
            <input type="text" id="newCheckItemInput" class="add-item-input" placeholder="新增其他行李物品..." onkeypress="handleChecklistKeyPress(event)">
            <button class="add-item-btn" onclick="addNewCheckItem()">新增</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 Tab 列 -->
    <nav class="bottom-nav">
      <button class="bottom-tab active" onclick="switchTab('itinerary')">
        <span class="tab-icon">🗺️</span>
        <span>行程</span>
      </button>
      <button class="bottom-tab" onclick="switchTab('checklist')">
        <span class="tab-icon">🧳</span>
        <span>行李清單</span>
      </button>
    </nav>
  </div>

    let currentDayIndex = 0;
    const daysNav = document.getElementById("daysNav");
    const timelineList = document.getElementById("timelineList");

    function renderDayButtons() {
      daysNav.innerHTML = itineraryData.map((day, index) => `
        <button class="day-btn ${index === currentDayIndex ? 'active' : ''}" onclick="switchDay(${index})">
          ${day.dayLabel}
        </button>
      `).join('');
    }

    function renderTimeline() {
      const dayData = itineraryData[currentDayIndex];
      timelineList.innerHTML = dayData.events.map(event => {
        // 如果是機票專用卡片
        if (event.type === 'flight') {
          return `
            <div class="timeline-item">
              <div class="time-badge">${event.time}</div>
              <div class="timeline-node"></div>
              <div class="flight-ticket-card">
                <div class="flight-ticket-top">
                  <span>✈️ ${event.flightNo}</span>
                  <span class="flight-badge">${event.seatClass}</span>
                </div>
                <div class="flight-ticket-body">
                  <div class="flight-airports">
                    <div class="airport-box">
                      <div class="airport-code">${event.depCode}</div>
                      <div class="airport-city">${event.depCity}</div>
                      <div class="airport-time">${event.depTime}</div>
                      <div class="airport-terminal">${event.depTerminal}</div>
                    </div>
                    <div class="flight-path">
                      <span class="flight-duration">${event.duration}</span>
                      <div class="flight-line">
                        <span class="flight-plane-icon">✈</span>
                      </div>
                      <span class="flight-type">${event.flightDate}</span>
                    </div>
                    <div class="airport-box">
                      <div class="airport-code">${event.arrCode}</div>
                      <div class="airport-city">${event.arrCity}</div>
                      <div class="airport-time">${event.arrTime}</div>
                      <div class="airport-terminal">${event.arrTerminal}</div>
                    </div>
                  </div>
                </div>
                <div class="flight-ticket-footer">
                  <span>登機證 BOARDING PASS</span>
                  <span class="barcode-line">||||| | |||| ||| |</span>
                </div>
              </div>
            </div>
          `;
        }

        // 一般行程卡片
        let targetMapUrl = event.mapUrl;
        if (!targetMapUrl && event.location) {
          targetMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;
        }

        const quickLinksHtml = event.quickLinks 
          ? `<div class="quick-links">
              ${event.quickLinks.map(ql => `<a href="${ql.url}" target="_blank" class="quick-link-chip">📍 ${ql.name}</a>`).join('')}
             </div>`
          : '';

        return `
          <div class="timeline-item">
            <div class="time-badge">${event.time}</div>
            <div class="timeline-node"></div>
            <div class="card">
              <div class="card-header">
                <span class="card-title">${event.title}</span>
                ${targetMapUrl ? `<a href="${targetMapUrl}" target="_blank" class="nav-btn">📍 導航</a>` : ''}
              </div>
              <p class="card-desc">${event.desc}</p>
              ${event.link ? `<a href="${event.link}" target="_blank" class="card-link">🔗 開啟售票/預約連結</a>` : ''}
              ${quickLinksHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function switchDay(index) {
      currentDayIndex = index;
      renderDayButtons();
      renderTimeline();
    }

    /* ==================== 2. 行李清單邏輯 (LocalStorage 記憶) ==================== */
    const defaultChecklist = [
      { text: "防曬", checked: false },
      { text: "衛生紙、濕紙巾", checked: false },
      { text: "耳塞、牙刷", checked: false },
      { text: "小塑膠袋（垃圾袋）", checked: false },
      { text: "換洗包(護髮)、保養品、化妝品(卸妝等)、梳子", checked: false },
      { text: "五天衣物", checked: false },
      { text: "護照（含影本）", checked: false },
      { text: "身分證", checked: false },
      { text: "錢包（信用卡、日幣）", checked: false },
      { text: "酒精、常備藥、OK繃", checked: false },
      { text: "豆腐頭、充電線、行動電源", checked: false },
      { text: "雨傘、外套", checked: false }
    ];

    let checklist = JSON.parse(localStorage.getItem('tokyo_luggage_checklist')) || defaultChecklist;

    function renderChecklist() {
      const container = document.getElementById("checklistItemsList");
      container.innerHTML = checklist.map((item, index) => `
        <div class="check-item ${item.checked ? 'done' : ''}" onclick="toggleCheck(${index}, event)">
          <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck(${index});">
          <span class="check-text">${item.text}</span>
          <button class="item-delete-btn" title="刪除此項" onclick="deleteCheckItem(${index}, event)">✕</button>
        </div>
      `).join('');
    }

    function toggleCheck(index, event) {
      if (event && event.target.tagName === 'BUTTON') return;
      checklist[index].checked = !checklist[index].checked;
      saveChecklist();
      renderChecklist();
    }

    function addNewCheckItem() {
      const input = document.getElementById("newCheckItemInput");
      const text = input.value.trim();
      if (!text) return;
      checklist.push({ text: text, checked: false });
      saveChecklist();
      renderChecklist();
      input.value = "";
    }

    function handleChecklistKeyPress(event) {
      if (event.key === 'Enter') {
        addNewCheckItem();
      }
    }

    function deleteCheckItem(index, event) {
      event.stopPropagation();
      checklist.splice(index, 1);
      saveChecklist();
      renderChecklist();
    }

    function resetChecklist() {
      if (confirm("確定要重置所有勾選狀態嗎？")) {
        checklist.forEach(item => item.checked = false);
        saveChecklist();
        renderChecklist();
      }
    }

    function saveChecklist() {
      localStorage.setItem('tokyo_luggage_checklist', JSON.stringify(checklist));
    }

    /* ==================== 3. 頁面分頁切換 ==================== */
    function switchTab(tabName) {
      const pageItinerary = document.getElementById("pageItinerary");
      const pageChecklist = document.getElementById("pageChecklist");
      const tabs = document.querySelectorAll(".bottom-tab");

      tabs.forEach(tab => tab.classList.remove("active"));

      if (tabName === 'itinerary') {
        pageItinerary.classList.add("active");
        pageChecklist.classList.remove("active");
        tabs[0].classList.add("active");
      } else {
        pageChecklist.classList.add("active");
        pageItinerary.classList.remove("active");
        tabs[1].classList.add("active");
      }
    }

    // 初始化渲染
    renderDayButtons();
    renderTimeline();
    renderChecklist();
  </script>
