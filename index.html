<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 1. 關鍵：鎖定手機畫面、禁止縮放、適應全螢幕/瀏海屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>東京自由行</title>

  <!-- 2. 偽裝成 App 的 iOS / Android 專用設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京行程">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* 抹去網頁感：禁止點擊高亮、禁止文字複製選取 */
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overscroll-behavior-y: none; /* 防止滑到底部時的網頁拉伸彈跳 */
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 75px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      min-height: 100vh;
    }

    /* 頂部 Header (包含 iPhone 安全區域 safe-area) */
    .header {
      background-color: #121c2b;
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 天數橫向導覽列 */
    .days-nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .days-nav::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background-color: #1a293e;
      color: #ffffff;
      border-color: #1a293e;
      box-shadow: 0 4px 10px rgba(26, 41, 62, 0.2);
    }

    /* 時間軸區域 */
    .timeline-container {
      padding: 8px 16px 20px 16px;
      position: relative;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 78px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background-color: #cbd5e1;
      z-index: 1;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    .time-badge {
      width: 52px;
      padding: 4px 6px;
      background-color: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .timeline-node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #1a293e;
      background-color: #ffffff;
      margin: 9px 12px 0 12px;
      z-index: 2;
      flex-shrink: 0;
    }

    /* 行程卡片 */
    .card {
      flex: 1;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: #f1f5f9;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .card-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      white-space: pre-line;
      -webkit-user-select: text; /* 允許長按複製備註內容 */
      user-select: text;
    }

    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: #2563eb;
      font-size: 12px;
      text-decoration: underline;
      word-break: break-all;
    }

    /* 底部 Tab 列 (適應 iPhone 底部橫條) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .bottom-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 11px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .bottom-tab.active {
      color: #2563eb;
      font-weight: bold;
    }

    .tab-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>🇯🇵 東京自由行 (8/31 ~ 9/4)</h1>
    </header>

    <div class="days-nav" id="daysNav"></div>
    <div class="timeline-container" id="timelineList"></div>

    <nav class="bottom-nav">
      <button class="bottom-tab">
        <span class="tab-icon">🔍</span>
        <span>探索</span>
      </button>
      <button class="bottom-tab active">
        <span class="tab-icon">🗺️</span>
        <span>行程</span>
      </button>
      <button class="bottom-tab">
        <span class="tab-icon">💰</span>
        <span>記帳</span>
      </button>
    </nav>
  </div>

  <script>
    const itineraryData = [
      {
        dayLabel: "Day 1 (8/31)",
        events: [
          { time: "12:35", title: "抵達成田機場", desc: "班機抵達，準備入境與搭車。" },
          { 
            time: "14:10", 
            title: "搭車前往迪士尼大使大飯店", 
            desc: "可選班次：\n• 14:10 ➔ 15:08\n• 14:40 ➔ 15:38\n• 15:00 ➔ 15:58\n• 15:45 ➔ 16:43",
            location: "迪士尼大使大飯店"
          },
          { 
            time: "16:00", 
            title: "飯店 Check-in", 
            desc: "📌 事項提醒：\n1. 記得領取「海洋優先入園券」\n2. 詢問隔天行李寄放服務",
            location: "迪士尼大使大飯店"
          },
          { time: "18:00", title: "飯店休閒與看煙火", desc: "逛飯店內特色商店，晚上可在房間內欣賞迪士尼煙火秀。" }
        ]
      },
      {
        dayLabel: "Day 2 (9/1)",
        events: [
          { time: "08:00", title: "飯店寄放行李", desc: "先至 JR 舞濱站/飯店寄放行李，準備入場。" },
          { time: "09:00", title: "東京迪士尼海洋", desc: "全天暢玩迪士尼海洋！", location: "東京迪士尼海洋" },
          { 
            time: "20:00", 
            title: "取行李 ➔ 前往東京車站飯店", 
            desc: "領取行李後，經過購物廣場步行至舞濱站。\n搭乘【JR京葉線】往東京車站（約 17 分鐘 / 6 站 / ¥260）。\n幾乎每 6 分鐘一班車。",
            location: "舞濱車站"
          },
          { time: "21:00", title: "東京車站飯店 Check-in", desc: "步行至飯店辦理入住並休息。" }
        ]
      },
      {
        dayLabel: "Day 3 (9/2)",
        events: [
          { 
            time: "上午", 
            title: "搭乘高速巴士前往御殿場", 
            desc: "票價：¥1,800 / 人（記得將車票印出來）\n提前預約車票（1 個月前開放）：",
            link: "https://www.kousokubus.net/JpnBus/zhtw#105_130039_220004_0_"
          },
          { 
            time: "11:00", 
            title: "御殿場 Premium Outlets 購物", 
            desc: "逛 Outlet 買好買滿！\n線上地圖與品牌分類指南：",
            link: "https://platinumaps.jp/d/premiumoutlets-gotemba?culture=en&floor=1F",
            location: "御殿場 Premium Outlets"
          },
          { time: "16:30", title: "搭乘回程巴士", desc: "預計搭乘 16:30 班次，約 18:10 抵達東京車站（票價：¥2,000）。" },
          { 
            time: "18:30", 
            title: "晚餐 & 東京車站周遭", 
            desc: "晚餐推薦：鳥貴族 串燒\n飯後可逛逛東京車站周邊夜景與商場。",
            location: "鳥貴族 東京車站"
          }
        ]
      },
      {
        dayLabel: "Day 4 (9/3)",
        events: [
          { 
            time: "08:44", 
            title: "從京橋搭車至澀谷", 
            desc: "搭乘【銀座線】往澀谷方向（約 19 分鐘 / 9 站 / ¥209）。\n09:03 抵達澀谷站。" 
          },
          { 
            time: "09:15", 
            title: "宮下公園 MIYASHITA PARK", 
            desc: "頂樓空中花園（08:00 開放），欣賞澀谷市景。",
            location: "MIYASHITA PARK"
          },
          { 
            time: "10:00", 
            title: "澀谷 PARCO 6樓動漫天堂", 
            desc: "步行約 5 分鐘抵達 PARCO 6F：\n• 任天堂 Nintendo TOKYO\n• 寶可夢中心 Pokémon Center\n• JUMP SHOP（需注意是否抽整理券）",
            location: "澀谷 PARCO"
          },
          { 
            time: "11:30", 
            title: "SHIBUYA 109 百貨", 
            desc: "逛女裝流行服飾。",
            location: "SHIBUYA 109"
          },
          { 
            time: "12:30", 
            title: "午餐時間", 
            desc: "選項：\n1. 旋轉壽司（11:00 記得先抽號碼牌）\n2. 炸豬排" 
          },
          { 
            time: "14:00", 
            title: "前往自由之丘", 
            desc: "從澀谷站搭乘【東急東橫線特急】至自由之丘（約 10 分鐘 / ¥180）。逛甜點與雜貨。",
            location: "自由之丘"
          },
          { 
            time: "18:30", 
            title: "晚餐（澀谷/東京）", 
            desc: "推薦：牛舌定食，晚上行程彈性規劃（抓預算約 ¥400）。" 
          }
        ]
      },
      {
        dayLabel: "Day 5 (9/4)",
        events: [
          { 
            time: "11:00", 
            title: "前往羽田機場", 
            desc: "車資約 ¥550 / 人。" 
          },
          { 
            time: "11:30", 
            title: "羽田機場 Check-in", 
            desc: "14:30 的班機，抓 11:30 前開始報到手續。\n報到完成後前往【第三航廈貴賓室】休息。",
            location: "羽田機場 第3航廈"
          }
        ]
      }
    ];

    let currentDayIndex = 0;

    const daysNav = document.getElementById("daysNav");
    const timelineList = document.getElementById("timelineList");

    function renderDayButtons() {
      daysNav.innerHTML = itineraryData.map((day, index) => `
        <button class="day-btn ${index === currentDayIndex ? 'active' : ''}" onclick="switchDay(${index})">
          ${day.dayLabel}
        </button>
      `).join('');
    }

    function renderTimeline() {
      const dayData = itineraryData[currentDayIndex];
      
      timelineList.innerHTML = dayData.events.map(event => {
        const mapSearchUrl = event.location 
          ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}` 
          : null;

        return `
          <div class="timeline-item">
            <div class="time-badge">${event.time}</div>
            <div class="timeline-node"></div>
            <div class="card">
              <div class="card-header">
                <span class="card-title">${event.title}</span>
                ${mapSearchUrl ? `<a href="${mapSearchUrl}" target="_blank" class="nav-btn">📍 導航</a>` : ''}
              </div>
              <p class="card-desc">${event.desc}</p>
              ${event.link ? `<a href="${event.link}" target="_blank" class="card-link">🔗 開啟網頁/預約連結</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function switchDay(index) {
      currentDayIndex = index;
      renderDayButtons();
      renderTimeline();
    }

    renderDayButtons();
    renderTimeline();
  </script>
</body>
</html>
