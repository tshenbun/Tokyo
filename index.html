<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>8/31-9/4 東京自由行</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京行程">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #dbeafe;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #e8f8f8 0%, #f4fbfb 50%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 75px;
      box-shadow: 0 0 25px rgba(0, 128, 138, 0.2);
      min-height: 100vh;
    }

    /* 頂部 Header */
    .header {
      background: linear-gradient(135deg, #005b66 0%, #00808a 50%, #00a896 100%);
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 91, 102, 0.35);
      border-bottom: 2px solid #a5f3fc;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 60, 70, 0.4);
    }

    /* 導覽頁面切換 */
    .page-view {
      display: none;
    }

    .page-view.active {
      display: block;
    }

    /* 天數橫向導覽列 */
    .days-nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .days-nav::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #b2f5ea;
      background-color: #ffffff;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: linear-gradient(135deg, #006d77 0%, #009688 100%);
      color: #ffffff;
      border-color: #80e9dd;
      box-shadow: 0 4px 12px rgba(0, 109, 119, 0.3);
    }

    /* 行程時間軸 */
    .timeline-container {
      padding: 8px 16px 20px 16px;
      position: relative;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 78px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background-color: #80e9dd;
      z-index: 1;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    .time-badge {
      width: 52px;
      padding: 4px 6px;
      background-color: #ccfbf1;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .timeline-node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #00808a;
      background-color: #ffffff;
      margin: 9px 12px 0 12px;
      z-index: 2;
      flex-shrink: 0;
    }

    .card {
      flex: 1;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(0, 109, 119, 0.05);
      border: 1px solid #e6f4f1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: #f0fdfa;
      color: #0d9488;
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      flex-shrink: 0;
      border: 1px solid #99f6e4;
    }

    .card-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      white-space: pre-line;
      -webkit-user-select: text;
      user-select: text;
    }

    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: #0284c7;
      font-size: 12px;
      text-decoration: underline;
      word-break: break-all;
    }

    /* ==================== 記帳頁面專用樣式 ==================== */
    .accounting-container {
      padding: 16px;
    }

    /* 總支出 Banner */
    .total-banner {
      background: linear-gradient(135deg, #005b66 0%, #00808a 100%);
      color: #ffffff;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 91, 102, 0.25);
      margin-bottom: 12px;
    }

    .total-banner-label {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .total-banner-amount {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 查看結算按鈕 */
    .settle-btn {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      border: 1.5px solid #00808a;
      color: #00808a;
      font-size: 14px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 128, 138, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    /* 表單區塊 */
    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0, 109, 119, 0.06);
      border: 1px solid #e6f4f1;
      margin-bottom: 20px;
    }

    .form-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      display: block;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .form-input:focus, .form-select:focus {
      border-color: #00808a;
      background-color: #ffffff;
    }

    /* 金額輸入區塊帶幣別與支付方式 */
    .amount-input-group {
      display: flex;
      gap: 8px;
    }

    .currency-select, .method-select {
      width: 90px;
      flex-shrink: 0;
      font-weight: 700;
      background-color: #f0fdfa;
      border-color: #99f6e4;
      color: #0f766e;
    }

    /* 區塊內嵌卡片 (代墊/分帳) */
    .inner-box {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .checkbox-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: #00808a;
    }

    /* 新增按鈕 */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #005b66 0%, #00808a 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 91, 102, 0.25);
    }

    /* 歷史帳單標題與篩選 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .date-filter-select {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #334155;
    }

    /* 歷史帳單卡片 */
    .history-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-info-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .history-info-sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 3px;
    }

    .history-amount-box {
      text-align: right;
    }

    .history-amount {
      font-size: 15px;
      font-weight: 800;
      color: #00808a;
    }

    .history-actions {
      margin-top: 4px;
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      opacity: 0.7;
    }

    .action-btn:hover {
      opacity: 1;
    }

    /* Modal 彈窗 (結算方案) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      text-align: center;
    }

    .modal-content {
      font-size: 14px;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
    }

    .modal-close-btn {
      width: 100%;
      padding: 10px;
      background-color: #00808a;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 底部 Tab 列 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background-color: #ffffff;
      border-top: 1px solid #e6f4f1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .bottom-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 12px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 6px 0;
    }

    .bottom-tab.active {
      color: #00808a;
      font-weight: bold;
    }

    .tab-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>8/31-9/4 東京自由行</h1>
    </header>

    <!-- 1. 行程頁面 -->
    <div id="pageItinerary" class="page-view active">
      <div class="days-nav" id="daysNav"></div>
      <div class="timeline-container" id="timelineList"></div>
    </div>

    <!-- 2. 記帳頁面 -->
    <div id="pageAccounting" class="page-view">
      <div class="accounting-container">
        
        <!-- 總支出 -->
        <div class="total-banner">
          <div class="total-banner-label">目前總支出 (已折算台幣)</div>
          <div class="total-banner-amount" id="totalAmountText">NT$ 0</div>
        </div>

        <!-- 查看結算方案按鈕 -->
        <button class="settle-btn" onclick="openSettleModal()">
          💸 查看最終結算方案
        </button>

        <!-- 新增花費表單 -->
        <div class="form-card">
          <div class="form-title">✨ 新增一筆花費</div>
          
          <div class="form-row form-group">
            <div style="flex: 1;">
              <label class="form-label">日期</label>
              <input type="date" id="expenseDate" class="form-input">
            </div>
            <div style="flex: 1;">
              <label class="form-label">時間</label>
              <input type="time" id="expenseTime" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">項目名稱</label>
            <input type="text" id="expenseTitle" class="form-input" placeholder="例如：迪士尼髮箍 / 晚餐燒肉">
          </div>

          <div class="form-group">
            <label class="form-label">總金額 & 支付方式 (必填)</label>
            <div class="amount-input-group">
              <select id="expenseCurrency" class="form-select currency-select">
                <option value="TWD">NT$</option>
                <option value="JPY" selected>¥ 日幣</option>
              </select>
              <input type="number" id="expenseAmount" class="form-input" placeholder="0" inputmode="decimal">
              <select id="expenseMethod" class="form-select method-select">
                <option value="現金">現金</option>
                <option value="刷卡">刷卡</option>
                <option value="PayPay">PayPay</option>
              </select>
            </div>
          </div>

          <!-- 誰代墊 -->
          <div class="inner-box">
            <label class="form-label">💳 誰代的墊？</label>
            <select id="expensePayer" class="form-select">
              <option value="Lily">Lily</option>
              <option value="陳">陳</option>
            </select>
          </div>

          <!-- 怎麼分帳 -->
          <div class="inner-box">
            <label class="form-label">🍔 參與平分的人：</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="splitLily" checked> Lily
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="splitChen" checked> 陳
              </label>
            </div>
          </div>

          <button class="submit-btn" onclick="addExpense()">新增入帳</button>
        </div>

        <!-- 歷史帳單列表與篩選 -->
        <div class="history-header">
          <div class="history-title">📑 歷史帳單</div>
          <select id="historyDateFilter" class="date-filter-select" onchange="renderHistory()">
            <option value="ALL">全部日期</option>
            <option value="2026-08-31">8/31 (Day 1)</option>
            <option value="2026-09-01">9/01 (Day 2)</option>
            <option value="2026-09-02">9/02 (Day 3)</option>
            <option value="2026-09-03">9/03 (Day 4)</option>
            <option value="2026-09-04">9/04 (Day 5)</option>
          </select>
        </div>

        <div id="historyList"></div>

      </div>
    </div>

    <!-- 底部 Tab 列 -->
    <nav class="bottom-nav">
      <button class="bottom-tab active" onclick="switchTab('itinerary')">
        <span class="tab-icon">🗺️</span>
        <span>行程</span>
      </button>
      <button class="bottom-tab" onclick="switchTab('accounting')">
        <span class="tab-icon">💰</span>
        <span>記帳</span>
      </button>
    </nav>
  </div>

  <!-- 結算方案 Modal 彈窗 -->
  <div class="modal-overlay" id="settleModal">
    <div class="modal-card">
      <div class="modal-title">📊 最終分帳結算</div>
      <div class="modal-content" id="settleModalContent">
        計算中...
      </div>
      <button class="modal-close-btn" onclick="closeSettleModal()">關閉</button>
    </div>
  </div>

  <script>
    /* ==================== 行程資料 ==================== */
    const itineraryData = [
      {
        dayLabel: "Day 1 (8/31)",
        events: [
          { time: "12:35", title: "抵達成田機場", desc: "班機抵達，準備入境與搭車。" },

      },
      {

        events: [
          { time: "06:30", title: "退房寄行李 & 出發", desc: "辦理退房並寄放行李，出發前往海洋提早入園門口，預計 07:00 前抵達排隊（最早可能 08:00 就開門卡位）。" },
          {

          {

            location: "Yucatan Base Camp Grill"
          },
          {

            desc: "• 補齊夢幻泉鄉尚未體驗的設施 (冰雪奇緣/樂佩公主)\n• 視時間去【失落河三角洲】與米妮/達菲合照\n• 或是回【地中海港灣】卡位「閃耀歡騰慶典」巡遊 (推論 17:00)\n• 備案空檔：【美人魚礁湖】室內區吹冷氣休息逛逛",
            location: "東京迪士尼海洋"
          },
          { 
            time: "18:00", 
            title: "晚餐 & 夢幻泉鄉夜景", 
            desc: "• 晚餐彈性於園區攤販或餐廳享用\n• 有空檔可回夢幻泉鄉欣賞點燈後的浪漫夜景",
            location: "東京迪士尼海洋"
          },
          { 
            time: "20:00", 
            title: "地中海港灣：堅信！夢想之海", 
            desc: "約 20:00 前抵達地中海港灣（表演推論 20:15 開始，約 30 分鐘）。若無 DPA 可邊走邊欣賞。",
            location: "地中海港灣"
          },
          {

          {

    let currentDayIndex = 0;
    const daysNav = document.getElementById("daysNav");
    const timelineList = document.getElementById("timelineList");

    function renderDayButtons() {
      daysNav.innerHTML = itineraryData.map((day, index) => `
        <button class="day-btn ${index === currentDayIndex ? 'active' : ''}" onclick="switchDay(${index})">
          ${day.dayLabel}
        </button>
      `).join('');
    }

    function renderTimeline() {
      const dayData = itineraryData[currentDayIndex];
      timelineList.innerHTML = dayData.events.map(event => {
        const mapSearchUrl = event.location 
          ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}` 
          : null;

        return `
          <div class="timeline-item">
            <div class="time-badge">${event.time}</div>
            <div class="timeline-node"></div>
            <div class="card">
              <div class="card-header">
                <span class="card-title">${event.title}</span>
                ${mapSearchUrl ? `<a href="${mapSearchUrl}" target="_blank" class="nav-btn">📍 導航</a>` : ''}
              </div>
              <p class="card-desc">${event.desc}</p>
              ${event.link ? `<a href="${event.link}" target="_blank" class="card-link">🔗 開啟網頁/預約連結</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function switchDay(index) {
      currentDayIndex = index;
      renderDayButtons();
      renderTimeline();
    }

    function switchTab(tabName) {
      const pageItinerary = document.getElementById("pageItinerary");
      const pageAccounting = document.getElementById("pageAccounting");
      const tabs = document.querySelectorAll(".bottom-tab");

      tabs.forEach(tab => tab.classList.remove("active"));

      if (tabName === 'itinerary') {
        pageItinerary.classList.add("active");
        pageAccounting.classList.remove("active");
        tabs[0].classList.add("active");
      } else {
        pageAccounting.classList.add("active");
        pageItinerary.classList.remove("active");
        tabs[1].classList.add("active");
      }
    }

    /* ==================== 記帳核心邏輯 ==================== */
    const JPY_RATE = 0.21; // 日幣轉台幣估算匯率
    let expenses = JSON.parse(localStorage.getItem('tokyo_expenses')) || [];

    // 初始化日期與時間欄位為當前時間
    function initFormDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('expenseDate').value = `${year}-${month}-${day}`;
      document.getElementById('expenseTime').value = `${hours}:${minutes}`;
    }

    // 新增花費
    function addExpense() {
      const date = document.getElementById('expenseDate').value;
      const time = document.getElementById('expenseTime').value;
      const title = document.getElementById('expenseTitle').value.trim();
      const amount = parseFloat(document.getElementById('expenseAmount').value);
      const currency = document.getElementById('expenseCurrency').value;
      const method = document.getElementById('expenseMethod').value;
      const payer = document.getElementById('expensePayer').value;

      const splitLily = document.getElementById('splitLily').checked;
      const splitChen = document.getElementById('splitChen').checked;

      if (!title) {
        alert('請輸入項目名稱！');
        return;
      }
      if (isNaN(amount) || amount <= 0) {
        alert('請輸入有效的金額！');
        return;
      }

      const participants = [];
      if (splitLily) participants.push('Lily');
      if (splitChen) participants.push('陳');

      if (participants.length === 0) {
        alert('請至少選擇一位參與平分的人！');
        return;
      }

      const newExpense = {
        id: Date.now(),
        date,
        time,
        title,
        amount,
        currency,
        method,
        payer,
        participants
      };

      expenses.push(newExpense);
      saveAndRender();

      // 清空表單
      document.getElementById('expenseTitle').value = '';
      document.getElementById('expenseAmount').value = '';
    }

    // 刪除花費
    function deleteExpense(id) {
      if (confirm('確定要刪除這筆花費嗎？')) {
        expenses = expenses.filter(item => item.id !== id);
        saveAndRender();
      }
    }

    // 儲存至 LocalStorage 並重繪
    function saveAndRender() {
      localStorage.setItem('tokyo_expenses', JSON.stringify(expenses));
      renderHistory();
      calculateTotals();
    }

    // 渲染歷史紀錄列表
    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const filterDate = document.getElementById('historyDateFilter').value;

      let filtered = [...expenses];
      if (filterDate !== 'ALL') {
        filtered = filtered.filter(item => item.date === filterDate);
      }

      // 按日期與時間倒序排列
      filtered.sort((a, b) => {
        const dateTimeA = `${a.date} ${a.time}`;
        const dateTimeB = `${b.date} ${b.time}`;
        return dateTimeB.localeCompare(dateTimeA);
      });

      if (filtered.length === 0) {
        historyList.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px; font-size:13px;">尚無花費紀錄</div>`;
        return;
      }

      historyList.innerHTML = filtered.map(item => {
        const symbol = item.currency === 'TWD' ? 'NT$' : '¥';
        const participantsText = item.participants.join('、');
        
        return `
          <div class="history-item">
            <div>
              <div class="history-info-title">${item.title}</div>
              <div class="history-info-sub">📅 ${item.date} ${item.time} (${item.method})</div>
              <div class="history-info-sub">💳 ${item.payer} 代墊 ｜ 🍔 分帳：${participantsText}</div>
            </div>
            <div class="history-amount-box">
              <div class="history-amount">${symbol} ${item.amount.toLocaleString()}</div>
              <div class="history-actions">
                <button class="action-btn" onclick="deleteExpense(${item.id})">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 計算總支出（自動折算台幣）
    function calculateTotals() {
      let totalTWD = 0;

      expenses.forEach(item => {
        if (item.currency === 'TWD') {
          totalTWD += item.amount;
        } else {
          totalTWD += item.amount * JPY_RATE;
        }
      });

      document.getElementById('totalAmountText').innerText = `NT$ ${Math.round(totalTWD).toLocaleString()}`;
    }

    // 計算最終分帳結算
    function openSettleModal() {
      let lilyPaidTWD = 0;
      let chenPaidTWD = 0;
      let lilyOwesTWD = 0;
      let chenOwesTWD = 0;

      expenses.forEach(item => {
        const amountTWD = item.currency === 'TWD' ? item.amount : item.amount * JPY_RATE;
        
        // 誰付的錢
        if (item.payer === 'Lily') lilyPaidTWD += amountTWD;
        if (item.payer === '陳') chenPaidTWD += amountTWD;

        // 誰應該分負擔
        const splitCount = item.participants.length;
        const shareTWD = amountTWD / splitCount;

        if (item.participants.includes('Lily')) lilyOwesTWD += shareTWD;
        if (item.participants.includes('陳')) chenOwesTWD += shareTWD;
      });

      // 淨值計算 (付出的 - 應該負擔的)
      const lilyNet = lilyPaidTWD - lilyOwesTWD;
      const chenNet = chenPaidTWD - chenOwesTWD;

      let resultText = '';

      if (expenses.length === 0) {
        resultText = '目前尚無花費紀錄。';
      } else if (Math.abs(lilyNet) < 1) {
        resultText = '🎉 雙方金額剛好平衡，不需要再互相轉帳！';
      } else if (lilyNet > 0) {
        // Lily 多付了，陳要給 Lily 錢
        resultText = `<strong>陳</strong> 需要給 <strong>Lily</strong>：<br><span style="font-size:22px; color:#00808a; font-weight:800;">NT$ ${Math.round(Math.abs(lilyNet)).toLocaleString()}</span>`;
      } else {
        // 陳多付了，Lily 要給 陳 錢
        resultText = `<strong>Lily</strong> 需要給 <strong>陳</strong>：<br><span style="font-size:22px; color:#00808a; font-weight:800;">NT$ ${Math.round(Math.abs(chenNet)).toLocaleString()}</span>`;
      }

      const modalContent = `
        <div style="margin-bottom:10px;">• Lily 總代墊：NT$ ${Math.round(lilyPaidTWD).toLocaleString()}</div>
        <div style="margin-bottom:14px;">• 陳 總代墊：NT$ ${Math.round(chenPaidTWD).toLocaleString()}</div>
        <hr style="border:none; border-top:1px dashed #cbd5e1; margin:10px 0;">
        <div style="text-align:center; padding:10px 0;">${resultText}</div>
        <div style="font-size:11px; color:#94a3b8; text-align:center; margin-top:6px;">* 日幣金額依預設匯率 ${JPY_RATE} 折算台幣</div>
      `;

      document.getElementById('settleModalContent').innerHTML = modalContent;
      document.getElementById('settleModal').classList.add('active');
    }

    function closeSettleModal() {
      document.getElementById('settleModal').classList.remove('active');
    }

    // 初始渲染
    renderDayButtons();
    renderTimeline();
    initFormDateTime();
    saveAndRender();
  </script>
