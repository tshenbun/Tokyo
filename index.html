  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #dbeafe;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, #e8f8f8 0%, #f4fbfb 50%, #f8fafc 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 25px;
      box-shadow: 0 0 25px rgba(0, 128, 138, 0.2);
      min-height: 100vh;
    }

    /* 頂部 Header - Tokyo DisneySea 25th Sparkling Jubilee 蒂芬妮藍綠漸層 */
    .header {
      background: linear-gradient(135deg, #005b66 0%, #00808a 50%, #00a896 100%);
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 20px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 91, 102, 0.35);
      border-bottom: 2px solid #a5f3fc;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 60, 70, 0.4);
    }

    /* 天數橫向導覽列 */
    .days-nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .days-nav::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #b2f5ea;
      background-color: #ffffff;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: linear-gradient(135deg, #006d77 0%, #009688 100%);
      color: #ffffff;
      border-color: #80e9dd;
      box-shadow: 0 4px 12px rgba(0, 109, 119, 0.3);
    }

    /* 時間軸區域 */
    .timeline-container {
      padding: 8px 16px 20px 16px;
      position: relative;
    }

    .timeline-container::before {
      content: '';
      position: absolute;
      left: 78px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background-color: #80e9dd;
      z-index: 1;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      position: relative;
    }

    .time-badge {
      width: 52px;
      padding: 4px 6px;
      background-color: #ccfbf1;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .timeline-node {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #00808a;
      background-color: #ffffff;
      margin: 9px 12px 0 12px;
      z-index: 2;
      flex-shrink: 0;
    }

    /* 行程卡片 */
    .card {
      flex: 1;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 2px 10px rgba(0, 109, 119, 0.05);
      border: 1px solid #e6f4f1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: #f0fdfa;
      color: #0d9488;
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      flex-shrink: 0;
      border: 1px solid #99f6e4;
    }

    .card-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.5;
      white-space: pre-line;
      -webkit-user-select: text;
      user-select: text;
    }

    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: #0284c7;
      font-size: 12px;
      text-decoration: underline;
      word-break: break-all;
    }

    /* 快捷多連結清單 */
    .quick-links {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-link-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>

          ${day.dayLabel}
        </button>
      `).join('');
    }

    function renderTimeline() {
      const dayData = itineraryData[currentDayIndex];
      timelineList.innerHTML = dayData.events.map(event => {
        // 優先使用精確 mapUrl，若無則透過 location 產生 Google Maps 搜尋連結
        let targetMapUrl = event.mapUrl;
        if (!targetMapUrl && event.location) {
          targetMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;
        }

        // 快捷多連結按鈕 (例如午餐/晚餐/PARCO 6F 多店家)
        const quickLinksHtml = event.quickLinks 
          ? `<div class="quick-links">
              ${event.quickLinks.map(ql => `<a href="${ql.url}" target="_blank" class="quick-link-chip">📍 ${ql.name}</a>`).join('')}
             </div>`
          : '';

        return `
          <div class="timeline-item">
            <div class="time-badge">${event.time}</div>
            <div class="timeline-node"></div>
            <div class="card">
              <div class="card-header">
                <span class="card-title">${event.title}</span>
                ${targetMapUrl ? `<a href="${targetMapUrl}" target="_blank" class="nav-btn">📍 導航</a>` : ''}
              </div>
              <p class="card-desc">${event.desc}</p>
              ${event.link ? `<a href="${event.link}" target="_blank" class="card-link">🔗 開啟售票/預約連結</a>` : ''}
              ${quickLinksHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function switchDay(index) {
      currentDayIndex = index;
      renderDayButtons();
      renderTimeline();
    }

    renderDayButtons();
    renderTimeline();
  </script>
</body>
</html>
